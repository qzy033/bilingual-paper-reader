<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双语论文阅读器 · Bilingual Paper Reader</title>
<style>
/* ============ themes ============ */
:root{
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;
  --sans:"Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --latin:Cambria,"Source Han Serif SC",Georgia,"Times New Roman",serif;
  --mono:"Cascadia Code",Consolas,monospace;
  --fs:16.5px; --side:288px;
}
body.theme-light{
  --bg:#f1ede2; --sheet:#fffdf8; --ink:#1f1c17; --ink2:#3b362e; --src:#4a443a;
  --muted:#8b8375; --rule:#e5dece; --rule2:#f0eadb; --accent:#1e4f6b;
  --accent2:#8d6a3c; --tint:#f6f1e4; --tint2:#eef3f5; --side-bg:#f8f4ea;
  --tip-bg:#1f2b33; --tip-fg:#f4efe4; --shadow:0 40px 80px -50px rgba(70,55,25,.5);
}
body.theme-sepia{
  --bg:#e9dcc2; --sheet:#fbf2df; --ink:#2c2418; --ink2:#4a3d2b; --src:#5a4a33;
  --muted:#8e7c5f; --rule:#e0cfae; --rule2:#eddfc4; --accent:#7a4b1e;
  --accent2:#9a6a2f; --tint:#f3e5cb; --tint2:#f0e8d5; --side-bg:#f4e8d0;
  --tip-bg:#3a2b18; --tip-fg:#f7ecd8; --shadow:0 40px 80px -50px rgba(80,55,20,.45);
}
body.theme-dark{
  --bg:#101216; --sheet:#191c21; --ink:#e9e5db; --ink2:#cfc9bd; --src:#a7a29a;
  --muted:#7e7a72; --rule:#2c3138; --rule2:#242830; --accent:#7db4d8;
  --accent2:#cba870; --tint:#20252c; --tint2:#1c2b34; --side-bg:#15181d;
  --tip-bg:#e9e5db; --tip-fg:#191c21; --shadow:0 40px 80px -50px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:var(--fs);line-height:1.95;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font-family:var(--sans)}
::selection{background:rgba(141,106,60,.22)}

/* ============ layout ============ */
.app{display:flex;min-height:100vh}
.side{width:var(--side);flex:0 0 var(--side);background:var(--side-bg);border-right:1px solid var(--rule);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 18px 40px;font-family:var(--sans)}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.brandmark{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--sheet);display:grid;place-items:center;font-size:13px;font-family:var(--latin);letter-spacing:-1px}
.brandmark b{font-family:var(--sans);font-size:13.5px;letter-spacing:.06em}
.brandmark span{display:block;font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.side h4{font-family:var(--sans);font-size:10.5px;letter-spacing:.22em;color:var(--accent2);margin:26px 0 8px;font-weight:600}
.side .papers{display:flex;flex-direction:column;gap:2px}
.side .papers button{text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--ink2);font-size:13px;line-height:1.5}
.side .papers button:hover{background:rgba(141,106,60,.1)}
.side .papers button.on{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.side .papers button small{display:block;font-size:10.5px;opacity:.7;font-family:var(--latin)}
.side .toc{list-style:none;margin:0;padding:0}
.side .toc li{margin:0}
.side .toc a{display:block;padding:5px 10px 5px 12px;font-size:12.8px;color:var(--ink2);border-left:2px solid transparent;line-height:1.6}
.side .toc a:hover{color:var(--accent);background:rgba(141,106,60,.08)}
.side .toc a.on{border-left-color:var(--accent2);color:var(--accent);background:rgba(141,106,60,.1)}
.side .tools{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.side .tools button{text-align:left;background:none;border:1px solid var(--rule);border-radius:7px;padding:7px 10px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.side .tools button:hover{border-color:var(--accent2);color:var(--accent2)}
.side .foot{margin-top:28px;font-size:10.5px;color:var(--muted);line-height:1.7}
.side .foot a{color:var(--muted);text-decoration:underline}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--sheet) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.topbar .in{max-width:1120px;margin:0 auto;padding:9px 34px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crumb{font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.04em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrls{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--sheet)}
.seg button{font-size:12px;padding:5px 13px;border:0;background:none;color:var(--ink2);cursor:pointer;letter-spacing:.04em}
.seg button+button{border-left:1px solid var(--rule2)}
.seg button.on{background:var(--accent);color:var(--sheet)}
.ico{width:36px;height:28px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink2);border-radius:7px;cursor:pointer;font-size:11.5px;display:grid;place-items:center;white-space:nowrap;padding:0}
.ico:hover{border-color:var(--accent2);color:var(--accent2)}
#prog{height:2px;background:var(--accent2);width:0;transition:width .1s linear}

.doc{max-width:1120px;width:100%;margin:0 auto;padding:0 34px 120px}
.thead{padding:46px 0 26px;border-bottom:1px solid var(--rule)}
.thead .kk{font-family:var(--sans);font-size:10.5px;letter-spacing:.3em;color:var(--accent2);text-transform:uppercase;margin-bottom:14px}
.thead h1{font-family:var(--sans);font-size:33px;line-height:1.35;margin:0 0 4px;letter-spacing:.01em}
.thead .h1en{font-family:var(--latin);font-size:18px;font-style:italic;color:var(--accent);margin:0 0 18px}
.thead .au{font-size:13.5px;color:var(--ink2);line-height:1.9}
.thead .au .en{font-family:var(--latin);color:var(--muted);font-size:12.5px}
.thead .blurb{margin:22px 0 0;padding:15px 18px;background:var(--tint);border-left:3px solid var(--accent2);font-size:15px;line-height:1.9}
.thead .blurb b{color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{font-family:var(--sans);font-size:11px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:3px 10px}

.sec{margin:60px 0 0;scroll-margin-top:64px}
.sec-head{display:flex;align-items:baseline;gap:16px;padding-bottom:11px;border-bottom:1.5px solid color-mix(in srgb,var(--ink) 55%,transparent);margin-bottom:4px}
.sec-num{font-family:var(--latin);font-size:34px;line-height:1;color:var(--accent2);opacity:.9;min-width:44px}
.sec-title h2{font-family:var(--sans);font-size:23px;font-weight:600;margin:0;letter-spacing:.02em}
.sec-title .en{font-family:var(--latin);font-size:13px;font-style:italic;color:var(--muted)}
.pg{margin-left:auto;font-family:var(--sans);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.lead{margin:16px 0 6px;padding:14px 18px;background:var(--tint2);border-left:3px solid var(--accent);font-size:14px;line-height:1.9;color:var(--ink2)}
.lead b{font-family:var(--sans);font-size:10.5px;letter-spacing:.2em;display:block;margin-bottom:3px;color:var(--accent)}

h3.sub{font-family:var(--sans);font-size:16.5px;font-weight:600;margin:34px 0 4px;letter-spacing:.02em;scroll-margin-top:70px}
h3.sub .n{color:var(--accent2);font-family:var(--latin);margin-right:8px;font-size:14px}
h3.sub .en{font-family:var(--latin);font-size:13px;font-style:italic;color:var(--muted);font-weight:400;margin-left:8px}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;padding:15px 0 13px;border-top:1px solid var(--rule2);transition:background .16s}
.pair:first-of-type{border-top:0}
.pair:hover,.pair.hl{background:linear-gradient(90deg,rgba(141,106,60,.055),rgba(141,106,60,.015))}
.pair > div{min-width:0;position:relative}
.src{font-family:var(--latin);font-size:calc(var(--fs) - 1px);line-height:1.78;color:var(--src)}
.tgt{line-height:1.95;color:var(--ink)}
.src p,.tgt p{margin:0 0 9px}
.src p:last-child,.tgt p:last-child{margin-bottom:0}
.src::after{content:"";position:absolute;left:-20px;top:5px;bottom:5px;width:1px;background:var(--rule2)}
.pair:hover .src::after,.pair.hl .src::after{background:var(--accent2)}

.term{color:var(--accent);border-bottom:1.5px dotted color-mix(in srgb,var(--accent) 55%,transparent);cursor:help;transition:background .15s}
.term:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.term.pinned{background:#fff3c4;color:var(--ink);border-bottom-color:transparent;border-radius:2px;
  box-shadow:0 0 0 1px rgba(214,164,42,.4);padding:0 1px}
body.theme-sepia .term.pinned{background:#f9e6b4}
body.theme-dark .term.pinned{background:rgba(255,213,102,.22);color:var(--ink);box-shadow:0 0 0 1px rgba(255,213,102,.45)}
.term.saved{border-bottom-style:solid;border-bottom-color:var(--accent2)}
mark.en-hl{background:#ffe9a6;color:inherit;border-radius:2px;padding:0 1px;box-shadow:0 0 0 1px rgba(214,164,42,.45)}
body.theme-sepia mark.en-hl{background:#f8dc9a}
body.theme-dark mark.en-hl{background:rgba(255,213,102,.32);box-shadow:0 0 0 1px rgba(255,213,102,.45)}

/* 引用文献 */
.cite{color:var(--accent2);text-decoration:none;border-bottom:1px dotted color-mix(in srgb,var(--accent2) 55%,transparent);padding:0 1px;border-radius:2px;font-family:var(--latin);font-size:.94em}
.cite:hover{background:color-mix(in srgb,var(--accent2) 16%,transparent)}
.cite.pinned{background:color-mix(in srgb,var(--accent2) 22%,transparent)}
.citebox{position:fixed;z-index:95;width:min(390px,86vw);max-height:54vh;overflow:auto;padding:12px 15px;background:var(--sheet);
  border:1px solid var(--rule);border-left:3px solid var(--accent2);box-shadow:0 22px 44px -24px rgba(50,40,20,.5);
  font-size:12.5px;line-height:1.7;opacity:0;visibility:hidden;transition:opacity .12s}
.citebox.on{opacity:1;visibility:visible}
.citebox .ch{font-family:var(--sans);font-size:9.5px;letter-spacing:.18em;color:var(--accent2);margin-bottom:6px}
.citebox .ct{font-family:var(--latin);font-size:12px;color:var(--ink2);line-height:1.65;margin-bottom:10px}
.citebox .ca{display:flex;gap:7px;flex-wrap:wrap}
.citebox .ca a{font-family:var(--sans);font-size:11.5px;color:var(--accent);border:1px solid var(--rule);border-radius:6px;padding:3px 9px;text-decoration:none}
.citebox .ca a:hover{border-color:var(--accent2);color:var(--accent2)}
.reflist{list-style:none;margin:8px 0 0;padding:0;font-family:var(--latin);font-size:12.5px;line-height:1.75;color:var(--ink2)}
.reflist li{position:relative;padding:6px 0 6px 46px;border-top:1px solid var(--rule2);scroll-margin-top:80px}
.reflist li:first-child{border-top:0}
.reflist li:hover,.reflist li:target{background:var(--tint)}
.reflist .rn{position:absolute;left:0;top:6px;width:38px;text-align:right;font-family:var(--sans);font-size:11px;color:var(--accent2)}
.reflink{font-family:var(--sans);font-size:10.5px;white-space:nowrap;color:var(--accent);border-bottom:0}
.tgt ul,.src ul{margin:6px 0 9px;padding-left:20px}
.tgt li,.src li{margin:5px 0}

.fn{margin:16px 0 0;padding:13px 16px;background:var(--tint);border:1px solid var(--rule);font-size:13px;line-height:1.85;color:var(--ink2)}
.fn b{font-family:var(--sans);font-size:10.5px;letter-spacing:.12em;color:var(--accent2);margin-right:7px}
.fn p{margin:0 0 7px}
.fn p:last-child{margin:0}
.fn .fn-en{font-family:var(--latin);font-style:italic;font-size:12px;line-height:1.7;color:var(--muted);border-top:1px dotted var(--rule);padding-top:7px;margin-top:7px}
sup.fnref{font-family:var(--latin);color:var(--accent2);font-size:.72em}

.eq{display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:center;margin:14px 0 4px;padding:13px 16px;
  background:var(--tint);border:1px solid var(--rule);border-left:3px solid var(--accent2)}
.eq .body{font-family:var(--latin);font-size:15.5px;overflow-x:auto;white-space:nowrap}
.eq .no{font-family:var(--latin);font-size:12.5px;color:var(--muted);text-align:right}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.2;margin:0 .18em}
.frac .q,.frac .d{padding:0 .3em}
.frac .d{border-top:1.2px solid currentColor}
.var{font-style:italic;font-family:var(--latin)}

.wide{margin:22px 0 8px}
figure{margin:0;padding:14px;background:var(--sheet);border:1px solid var(--rule)}
figure img{display:block;width:100%;height:auto}
figure.size-s img{max-width:340px;margin:0 auto}
figure.size-m img{max-width:700px;margin:0 auto}
figcaption{margin-top:10px;font-size:12.5px;line-height:1.8;color:var(--ink2)}
figcaption b{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;color:var(--accent2);margin-right:5px}
figcaption .en{display:block;font-family:var(--latin);font-style:italic;font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}
.labels{margin-top:12px;border-top:1px dashed var(--rule);padding-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:2px 24px}
.labels div{font-size:12px;color:var(--ink2);line-height:1.75}
.labels code{font-family:var(--latin);font-size:12px;color:var(--accent);background:var(--tint2);padding:0 4px;border-radius:3px}

table{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:13px;font-family:var(--sans)}
caption{caption-side:top;text-align:left;font-size:12.5px;line-height:1.8;color:var(--ink2);padding:0 0 8px}
caption b{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;color:var(--accent2);margin-right:5px}
th,td{padding:6px 9px;text-align:center;border-bottom:1px solid var(--rule2);font-variant-numeric:tabular-nums}
thead th{background:var(--tint);font-weight:600;font-size:12px;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
tbody tr:hover{background:var(--tint)}
tr.hl-row td{background:var(--tint);font-weight:600}

.gloss{display:grid;grid-template-columns:1fr 1fr;gap:0 36px}
.gloss .g{padding:10px 0;border-top:1px solid var(--rule2);font-size:13.5px;line-height:1.8}
.gloss .g b{font-family:var(--latin);color:var(--accent);display:block;font-size:13px}
.gloss .g em{font-style:normal;font-family:var(--sans);font-size:12px;color:var(--muted)}

.colophon{margin:70px 0 0;padding-top:22px;border-top:1px solid color-mix(in srgb,var(--ink) 45%,transparent);font-size:12.5px;line-height:1.9;color:var(--muted)}
.colophon p{margin:0 0 7px}

/* ============ tooltip & card ============ */
.tip{position:fixed;z-index:90;max-width:340px;max-height:48vh;overflow:auto;padding:11px 14px;background:var(--tip-bg);color:var(--tip-fg);
  font-size:12.8px;line-height:1.75;border-radius:9px;box-shadow:0 18px 40px -14px rgba(0,0,0,.45);
  opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .13s,transform .13s;pointer-events:none;font-family:var(--sans)}
.tip.on{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.tip b{color:var(--accent2);font-weight:600}
.tip .en{font-family:var(--latin);font-style:italic;opacity:.75}
.tip .save{display:block;margin-top:7px;font-size:10.5px;letter-spacing:.12em;color:var(--accent2);cursor:pointer;opacity:.9}
.xcard{position:fixed;z-index:80;width:min(560px,86vw);max-height:58vh;overflow:auto;padding:13px 17px;background:var(--sheet);
  border:1px solid var(--rule);border-left:3px solid var(--accent);box-shadow:0 22px 44px -24px rgba(50,40,20,.5);
  font-size:14px;line-height:1.9;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.xcard.on{opacity:1;visibility:visible}
.xcard .lbl{font-family:var(--sans);font-size:9.5px;letter-spacing:.2em;color:var(--accent2);display:block;margin-bottom:5px}

/* ============ 书架 ============ */
.shelfview{position:fixed;inset:0;z-index:98;background:var(--bg);display:none;overflow:auto}
.shelfview.on{display:block}
.sv-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 28px;
  background:color-mix(in srgb,var(--sheet) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.sv-title b{font-family:var(--sans);font-size:15px;letter-spacing:.08em}
.sv-title span{font-family:var(--sans);font-size:9.5px;letter-spacing:.22em;color:var(--muted);margin-left:8px;text-transform:uppercase}
#shelfQ{flex:1;max-width:320px;padding:6px 11px;border:1px solid var(--rule);border-radius:8px;
  background:var(--sheet);font-family:var(--sans);font-size:12.5px;color:var(--ink)}
.sv-stat{font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.sv-act,.sv-close{margin-left:auto;font-family:var(--sans);font-size:11.5px;border:1px solid var(--rule);
  background:var(--sheet);color:var(--ink2);border-radius:7px;padding:5px 10px;cursor:pointer}
.sv-close{margin-left:0}
.sv-act:hover,.sv-close:hover{border-color:var(--accent2);color:var(--accent2)}
.sv-filter{display:flex;gap:7px;flex-wrap:wrap;padding:14px 28px 2px;max-width:1180px;margin:0 auto}
.chipbtn{font-family:var(--sans);font-size:11.5px;padding:4px 11px;border:1px solid var(--rule);border-radius:999px;
  background:var(--sheet);color:var(--ink2);cursor:pointer}
.chipbtn.on{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
.sv-body{max-width:1180px;margin:0 auto;padding:6px 28px 90px}
.sgroup h3{font-family:var(--sans);font-size:11.5px;letter-spacing:.18em;color:var(--accent2);
  margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule);font-weight:600}
.sgroup h3 i{font-style:normal;color:var(--muted);margin-left:8px;letter-spacing:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:13px}
.scard{display:flex;flex-direction:column;gap:5px;padding:13px 15px;background:var(--sheet);
  border:1px solid var(--rule);transition:.15s}
.scard:hover{border-color:var(--accent2);transform:translateY(-1px);box-shadow:0 14px 30px -20px rgba(60,45,20,.55)}
.scard.todo{opacity:.78}
.scard.flash{outline:2px solid var(--accent2);outline-offset:2px}
.stop{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:10px;letter-spacing:.12em;color:var(--muted)}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.scard.todo .sdot{background:none;border:1px solid var(--muted)}
.sarx{margin-left:auto;font-family:var(--latin);letter-spacing:0}
.scard h4{margin:1px 0 0;font-family:var(--sans);font-size:15px;line-height:1.45;letter-spacing:.01em}
.sen{margin:0;font-family:var(--latin);font-size:11.5px;line-height:1.5;color:var(--muted)}
.sstats{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.sstats span{font-family:var(--sans);font-size:10px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:1px 7px}
.sfoot{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:9px}
.sgo{font-family:var(--sans);font-size:11.5px;border:1px solid var(--accent);background:var(--accent);color:var(--sheet);
  border-radius:6px;padding:4px 10px;cursor:pointer}
.sgo.ghost{background:none;color:var(--ink2);border-color:var(--rule)}
.sgo:hover{opacity:.9}
.slink{font-family:var(--sans);font-size:11px;color:var(--accent);border:0}
.smove{margin-left:auto;font-family:var(--sans);font-size:10.5px;border:1px solid var(--rule);border-radius:6px;
  background:var(--sheet);color:var(--ink2);padding:3px 2px;cursor:pointer}
.sempty{font-family:var(--sans);font-size:13px;color:var(--muted);padding:40px 0}
.grp{font-family:var(--sans);font-size:10px;letter-spacing:.18em;color:var(--accent2);margin:14px 0 3px;padding-left:2px}
.grp i{font-style:normal;color:var(--muted);margin-left:6px;letter-spacing:0}
.side .papers button.todo{opacity:.72}
.side .papers button .dotq{display:inline-block;width:5px;height:5px;border:1px solid var(--muted);border-radius:50%;margin-right:6px}

/* ============ drawer ============ */
.drawer{position:fixed;inset:0;z-index:100;display:none}
.drawer.on{display:block}
.drawer .mask{position:absolute;inset:0;background:rgba(20,15,5,.35)}
.drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(520px,92vw);background:var(--sheet);border-left:1px solid var(--rule);
  padding:24px 26px;overflow:auto;box-shadow:-20px 0 60px -30px rgba(0,0,0,.4)}
.drawer h3{font-family:var(--sans);font-size:14px;letter-spacing:.18em;color:var(--accent2);margin:0 0 16px}
.drawer .row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--rule2);font-size:13px}
.drawer .row b{font-family:var(--latin);color:var(--accent)}
.drawer .row span.x{cursor:pointer;color:var(--muted);font-size:11px}
.drawer .empty{font-size:13px;color:var(--muted)}
.drawer .act{display:flex;gap:8px;margin-top:16px}
.drawer .act button{border:1px solid var(--rule);background:none;border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--ink2)}
.drawer .act button:hover{border-color:var(--accent2);color:var(--accent2)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink2)}

/* ============ modes ============ */
body.m-en .pair{grid-template-columns:1fr}
body.m-en .tgt{display:none}
body.m-en .src{font-size:calc(var(--fs) + .6px);line-height:1.85;max-width:80ch}
body.m-zh .pair{grid-template-columns:1fr}
body.m-zh .src{display:none}
body.m-zh .tgt{max-width:74ch}

@media screen and (max-width:1000px){
  .side{position:fixed;z-index:60;transform:translateX(-100%);transition:transform .22s;box-shadow:20px 0 50px -30px rgba(0,0,0,.4)}
  body.nav .side{transform:none}
  .doc{padding:0 20px 90px}
  .pair{grid-template-columns:1fr;gap:6px}
  .src{border-bottom:1px dashed var(--rule);padding-bottom:9px}
  .src::after{display:none}
  .gloss,.labels{grid-template-columns:1fr}
  .thead h1{font-size:25px}
}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff;font-size:9pt;line-height:1.6}
  .side,.topbar,#prog,.tip,.xcard,.citebox,.drawer{display:none!important}
  .doc{max-width:none;padding:0}
  .pair{grid-template-columns:1fr 1fr;gap:0 7mm;break-inside:avoid;padding:2.2mm 0}
  .src{font-size:8.2pt;line-height:1.5}
  .tgt{line-height:1.7}
  figure,table,.eq,.fn,.lead{break-inside:avoid}
  .sec{margin:8mm 0 0;break-before:auto}
  .sec-head,h3.sub{break-after:avoid}
  mark.en-hl{background:#fff0bd;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script src="papers/library.js"></script>
<script>
(function(){
"use strict";

/* ---------- state ---------- */
var PAPERS = window.PAPERS || [];
var store = {
  get:function(k,d){ try{var v=localStorage.getItem("br:"+k); return v?JSON.parse(v):d;}catch(e){return d;} },
  set:function(k,v){ try{localStorage.setItem("br:"+k,JSON.stringify(v));}catch(e){} }
};
var S = {
  id: null,
  mode: store.get("mode","m-dual"),
  theme: store.get("theme","theme-light"),
  fs: store.get("fs",16.5),
  vocab: store.get("vocab",{})
};

/* ---------- helpers ---------- */
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function el(tag,cls,html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
var CUR_TERMS = {};
function escq(s){ return String(s).replace(/"/g,"&quot;"); }
function guessEn(tip){
  var m=/<i>([^<]{2,60})<\/i>/.exec(tip);
  if(!m) return "";
  var t=m[1].split(/[,，、/（(]/)[0].trim();
  return /[A-Za-z]/.test(t) ? t : "";
}
function terms(s){
  return String(s==null?"":s).replace(/\[\[([^\]|]*)\|([^\]]+)\]\]/g,function(_,a,b){
    var lead=/^\s*<b>/.test(b) ? "" : "<b>"+escq(a)+"</b>　";
    var en=CUR_TERMS[a]||guessEn(b);
    return '<span class="term" data-tip="'+lead+escq(b)+'"'+(en?' data-en="'+escq(en)+'"':'')+'>'+a+'</span>';
  });
}
var CUR_REFS = {};
function citeify(html){
  if(!html) return html;
  var hit=false;
  var out=String(html).split(/(<[^>]*>)/).map(function(seg){
    if(!seg || seg.charAt(0)==="<") return seg;
    return seg.replace(/\[(\d{1,2}(?:\s*,\s*\d{1,2})*)\]/g,function(m,list){
      var nums=list.split(/\s*,\s*/).filter(function(x){ return CUR_REFS[x]; });
      if(!nums.length) return m;
      hit=true;
      return "["+nums.map(function(x){
        return '<a class="cite" data-ref="'+x+'" href="#ref-'+x+'">'+x+'</a>';
      }).join(", ")+"]";
    });
  }).join("");
  return hit?out:html;
}
function paras(s){
  if(s==null||s==="") return "";
  var t=String(s).trim();
  if(/^<(ul|ol|div|p|table|blockquote|figure|h\d)/i.test(t)) return citeify(terms(t));
  return citeify(t.split(/\n\s*\n/).map(function(p){
    p=p.trim(); if(!p) return "";
    return "<p>"+terms(p)+"</p>";
  }).join(""));
}
function attr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

/* ---------- boot ---------- */
document.body.className = S.theme + " " + S.mode;
document.documentElement.style.setProperty("--fs", S.fs+"px");

function boot(){
  if(!PAPERS.length){ document.getElementById("doc").innerHTML =
    '<p style="padding:60px 0;color:#8b8375">没有找到论文数据。请确认 <code>papers/</code> 目录下的数据文件已通过 &lt;script&gt; 引入。</p>'; return; }
  buildLibrary();
  var wanted = store.get("current", PAPERS[0].id);
  var p = PAPERS.filter(function(x){return x.id===wanted;})[0] || PAPERS[0];
  open(p, true);
}

function buildLibrary(){
  var box=document.getElementById("paperList"); box.innerHTML="";
  var items = shelfItems();
  if(!items.length){
    PAPERS.forEach(function(p){
      var b=el("button", null, '<span>'+esc(p.meta.titleZh||p.meta.title)+'</span><small>'+esc(p.meta.title)+'</small>');
      b.dataset.id=p.id; b.onclick=function(){ open(p); }; box.appendChild(b);
    });
    return;
  }
  var groups = shelfGroups();
  groups.forEach(function(g){
    var list = items.filter(function(it){ return it.group===g; });
    if(!list.length) return;
    box.appendChild(el("div","grp", esc(g) + '<i>' + list.length + '</i>'));
    list.forEach(function(it){
      var b=el("button", it.status==="ready"?"":"todo");
      b.innerHTML='<span>'+(it.status==="ready"?'':'<em class="dotq"></em>')+esc(it.titleZh||it.titleEn)+'</span>'+
        '<small>'+esc(it.titleEn)+'</small>';
      b.onclick=function(){
        if(it.status==="ready"){ open(byId(it.id)); }
        else { openShelf(it.arxiv); }
      };
      box.appendChild(b);
    });
  });
}

function byId(id){ return PAPERS.filter(function(p){return p.id===id;})[0]; }

/* ---------- 书架 ---------- */
function shelfOverrides(){ return store.get("shelfGroups", {}); }
function statsOf(p){
  var pairs=0, terms=0, chars=0;
  (p.sections||[]).forEach(function(s){
    (s.blocks||[]).forEach(function(b){
      if(b.type==="pair"){ pairs++; chars += (b.zh||"").length; }
      if(b.zh) terms += ((String(b.zh).match(/\[\[/g)||[]).length);
    });
  });
  return {sections:(p.sections||[]).length, pairs:pairs, terms:terms, chars:chars,
          minutes:Math.max(1,Math.round(chars/420))};
}
function shelfItems(){
  var shelf = window.SHELF || {groups:[], items:[]};
  var ov = shelfOverrides();
  var items=[], seen={};
  (shelf.items||[]).forEach(function(src){
    var p = src.status==="ready" ? byId(src.id) : null;
    items.push({
      arxiv: src.arxiv||"", id: p?p.id:"",
      titleEn: (p && p.meta.title) || src.titleEn || src.arxiv || "",
      titleZh: (p && (p.meta.titleZh||p.meta.title)) || src.titleZh || "",
      group: ov[src.arxiv] || src.group || "未分组",
      status: p ? "ready" : "todo",
      stats: p ? statsOf(p) : null,
      pdf: src.pdf || (src.arxiv ? "../papers/"+src.arxiv+".pdf" : ""),
      note: src.note || ""
    });
    if(p) seen[p.id]=1;
  });
  PAPERS.forEach(function(p){
    if(seen[p.id]) return;
    items.push({arxiv:p.meta.arxiv||"", id:p.id, titleEn:p.meta.title,
      titleZh:p.meta.titleZh||p.meta.title, group: p.meta.group||"未分组",
      status:"ready", stats:statsOf(p), pdf:"", note:""});
  });
  return items;
}
function shelfGroups(){
  var shelf = window.SHELF || {groups:[]};
  var items = shelfItems(), out=[];
  (shelf.groups||[]).forEach(function(g){ if(out.indexOf(g)<0) out.push(g); });
  items.forEach(function(it){ if(out.indexOf(it.group)<0) out.push(it.group); });
  return out.filter(function(g){return g!=="未分组";}).concat(out.indexOf("未分组")>=0?["未分组"]:[]);
}
function openShelf(focus){
  var v=document.getElementById("shelfview");
  v.classList.add("on"); renderShelf();
  if(focus){
    var c=document.querySelector('.scard[data-arxiv="'+focus+'"]');
    if(c){ c.scrollIntoView({block:"center"}); c.classList.add("flash"); setTimeout(function(){c.classList.remove("flash");},1600); }
  }
}
function closeShelf(){ var v=document.getElementById("shelfview"); if(v) v.classList.remove("on"); }
function renderShelf(){
  var body=document.getElementById("shelfBody"); if(!body) return;
  var items=shelfItems(), groups=shelfGroups();
  var q=(document.getElementById("shelfQ").value||"").trim().toLowerCase();
  var filter=document.getElementById("shelfFilter").dataset.g||"全部";
  var ready=items.filter(function(i){return i.status==="ready";}).length;

  var chips=['<button class="chipbtn'+(filter==="全部"?" on":"")+'" data-g="全部">全部 '+items.length+'</button>'];
  groups.forEach(function(g){
    var n=items.filter(function(i){return i.group===g;}).length;
    if(!n) return;
    chips.push('<button class="chipbtn'+(filter===g?" on":"")+'" data-g="'+attr(g)+'">'+esc(g)+' '+n+'</button>');
  });
  document.getElementById("shelfFilter").innerHTML=chips.join("");
  document.getElementById("shelfStat").textContent = ready+" 本已译 · "+(items.length-ready)+" 本待译";

  var html="";
  groups.forEach(function(g){
    if(filter!=="全部" && filter!==g) return;
    var list=items.filter(function(i){return i.group===g;}).filter(function(i){
      if(!q) return true;
      return (i.titleZh+" "+i.titleEn+" "+i.arxiv).toLowerCase().indexOf(q)>=0;
    });
    if(!list.length) return;
    html+='<div class="sgroup"><h3>'+esc(g)+'<i>'+list.length+'</i></h3><div class="sgrid">';
    list.forEach(function(i){
      var s=i.stats;
      html+='<article class="scard '+(i.status==="ready"?"ready":"todo")+'" data-arxiv="'+attr(i.arxiv)+'">'+
        '<div class="stop"><span class="sdot"></span><span class="sstate">'+(i.status==="ready"?"已译":"待译")+'</span>'+
        (i.arxiv?'<span class="sarx">'+esc(i.arxiv)+'</span>':'')+'</div>'+
        '<h4>'+esc(i.titleZh||i.titleEn)+'</h4>'+
        '<p class="sen">'+esc(i.titleEn)+'</p>'+
        (s?'<div class="sstats"><span>'+s.sections+' 节</span><span>'+s.pairs+' 段对照</span><span>'+s.terms+' 术语</span><span>约 '+s.minutes+' 分钟</span></div>':
            '<div class="sstats"><span>未翻译</span>'+(i.pdf?'<span>PDF 已就位</span>':'')+'</div>')+
        '<div class="sfoot">'+
          (i.status==="ready"
            ? '<button class="sgo" data-open="'+attr(i.id)+'">继续阅读 →</button>'
            : '<button class="sgo ghost" data-todo="'+attr(i.arxiv)+'">怎么译？</button>'+
              (i.pdf?'<a class="slink" href="'+attr(i.pdf)+'" target="_blank" rel="noopener">PDF ↗</a>':''))+
          '<select class="smove" data-move="'+attr(i.arxiv||i.id)+'" title="移动到分组">'+
            groups.map(function(g){return '<option'+(g===i.group?" selected":"")+'>'+esc(g)+'</option>';}).join("")+
          '</select>'+
        '</div></article>';
    });
    html+='</div></div>';
  });
  body.innerHTML = html || '<p class="sempty">没有匹配的论文。</p>';
}
function shelfExport(){
  var items=shelfItems(), groups=shelfGroups();
  var out={groups:groups, items:items.map(function(i){
    return {arxiv:i.arxiv, slug:i.id||null, group:i.group, titleEn:i.titleEn, titleZh:i.titleZh};
  })};
  var blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="manifest.json"; a.click();
}

function open(p, first){
  S.id=p.id; store.set("current",p.id);
  var crumb=document.getElementById("crumb");
  if(crumb) crumb.textContent = (p.meta.titleZh||p.meta.title)+"　·　"+p.meta.title;
  Array.prototype.forEach.call(document.querySelectorAll("#paperList button"),function(b){
    b.classList.toggle("on", b.dataset.id===p.id);
  });
  render(p);
  buildTOC(p);
  if(!first){ window.scrollTo(0,0); }
  var pos = store.get("pos:"+p.id,0);
  if(pos>50) setTimeout(function(){ window.scrollTo(0,pos); }, 60);
  document.body.classList.remove("nav");
}

/* ---------- render ---------- */
function render(p){
  var doc=document.getElementById("doc");
  doc.innerHTML="";
  CUR_TERMS = p.termEn || {};
  CUR_REFS = {};
  (p.references||[]).forEach(function(r){ CUR_REFS[r.n]=r; });
  document.title = (p.meta.titleZh||p.meta.title) + " · 双语阅读";

  /* header */
  var head=el("header","thead");
  head.innerHTML =
    '<div class="kk">Bilingual Paper · 中英对照精读</div>'+
    '<h1>'+esc(p.meta.titleZh||p.meta.title)+'</h1>'+
    '<p class="h1en">'+esc(p.meta.title)+'</p>'+
    '<div class="au">'+esc(p.meta.authors||"")+'<br><span class="en">'+esc(p.meta.affil||"")+'</span><br>'+esc(p.meta.venue||"")+'</div>'+
    (p.meta.blurb?'<p class="blurb">'+p.meta.blurb+'</p>':"")+
    '<div class="chips">'+ (p.meta.chips||[]).map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join("") +'</div>';
  doc.appendChild(head);

  /* sections */
  (p.sections||[]).forEach(function(sec){
    var s=el("section","sec"); s.id=sec.id;
    var h=el("div","sec-head");
    h.innerHTML='<div class="sec-num">'+esc(sec.num||"")+'</div>'+
      '<div class="sec-title"><h2>'+esc(sec.title||"")+'</h2>'+
      (sec.titleEn?'<div class="en">'+esc(sec.titleEn)+'</div>':'')+'</div>'+
      (sec.page?'<div class="pg">'+esc(sec.page)+'</div>':'');
    s.appendChild(h);
    if(sec.lead) s.appendChild(el("div","lead","<b>导读</b>"+terms(sec.lead)));

    (sec.blocks||[]).forEach(function(b){ var n=block(b,p); if(n) s.appendChild(n); });
    doc.appendChild(s);
  });

  /* glossary */
  if((p.glossary||[]).length){
    var g=el("section","sec"); g.id="glossary";
    var gh=el("div","sec-head");
    gh.innerHTML='<div class="sec-num">G</div><div class="sec-title"><h2>术语表</h2><div class="en">Glossary</div></div>';
    g.appendChild(gh);
    var box=el("div","gloss");
    p.glossary.forEach(function(t){
      box.appendChild(el("div","g",'<b>'+esc(t[0])+'</b><em>'+esc(t[1])+'</em>'+terms(t[2]||"")));
    });
    g.appendChild(box); doc.appendChild(g);
  }

  /* colophon */
  var c=el("div","colophon",
    '<p><b>译本说明</b>　'+esc(p.meta.note||"本文为非官方中文译本，仅供学习使用；原文版权归原作者所有。左栏为原文照录（仅调整断行与连字符），右栏为译文。")+'</p>'+
    '<p>数据来源：'+esc(p.meta.source||"")+'　·　阅读器：双语论文阅读器（本地单文件，无网络请求）</p>');
  doc.appendChild(c);
  restoreVocabMarks();
}

function block(b,p){
  if(!b||!b.type) return null;
  if(b.type==="sub"){
    var h=el("h3","sub",'<span class="n">'+esc(b.num||"")+'</span>'+esc(b.zh||"")+(b.en?'<span class="en">'+esc(b.en)+'</span>':""));
    if(b.id) h.id=b.id;
    return h;
  }
  if(b.type==="pair"){
    var row=el("div","pair");
    row.appendChild(el("div","src",paras(b.en)));
    row.appendChild(el("div","tgt",paras(b.zh)));
    return row;
  }
  if(b.type==="eq"){
    var e=el("div","eq");
    e.innerHTML='<div class="body">'+b.html+'</div><div class="no">'+esc(b.no||"")+'</div>';
    return e;
  }
  if(b.type==="fig"){
    var f=el("div","wide"), fig=el("figure","size-"+(b.size||"full"));
    fig.innerHTML='<img src="'+attr(b.src)+'" alt="'+attr(b.alt||"")+'">';
    var cap='<figcaption><b>'+esc(b.label||"图")+'</b>'+citeify(terms(b.zh||""))+
      (b.en?'<span class="en">'+esc(b.en)+'</span>':"")+'</figcaption>';
    fig.insertAdjacentHTML("beforeend",cap);
    if(b.labels&&b.labels.length){
      var lb='<div class="labels">'+b.labels.map(function(l){
        return '<div><code>'+esc(l[0])+'</code> '+esc(l[1])+'</div>';
      }).join("")+'</div>';
      fig.insertAdjacentHTML("beforeend",lb);
    }
    f.appendChild(fig); return f;
  }
  if(b.type==="table"){
    var w=el("div","wide");
    w.innerHTML=citeify(b.html||"");
    return w;
  }
  if(b.type==="refs"){
    var wrap=el("div","wide");
    var keys=Object.keys(CUR_REFS).sort(function(a,b){ return a-b; });
    if(!keys.length){ wrap.innerHTML=b.html||""; return wrap; }
    var ol=document.createElement("ol"); ol.className="reflist";
    keys.forEach(function(k){
      var r=CUR_REFS[k], li=document.createElement("li");
      li.id="ref-"+k;
      li.innerHTML='<span class="rn">['+k+']</span>'+esc(r.text)+
        (r.url?' <a class="reflink" target="_blank" rel="noopener" href="'+attr(r.url)+'">arXiv ↗</a>':"");
      ol.appendChild(li);
    });
    wrap.appendChild(ol); return wrap;
  }
  if(b.type==="note"){
    var fn=el("div","fn",'<p><b>'+esc(b.label||"注")+'</b>'+terms(b.html||"")+'</p>');
    if(b.en) fn.insertAdjacentHTML("beforeend",'<p class="fn-en">'+esc(b.en)+'</p>');
    return fn;
  }
  if(b.type==="raw"){
    var r=el("div","wide"); r.innerHTML=b.html||""; return r;
  }
  return null;
}

    var a=el("a",null,esc(sec.num?""+sec.num+"　":"")+esc(sec.title||""));

/* ---------- 中文术语 -> 英文原文高亮 ---------- */
var enMarks=[];
function clearEnHL(){
  enMarks.forEach(function(m){
    var p=m.parentNode; if(!p) return;
    p.replaceChild(document.createTextNode(m.textContent), m);
    p.normalize();
  });
  enMarks=[];
}
function termRe(phrase){
  var body=phrase.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  var pre=/^[A-Za-z0-9]/.test(phrase) ? "(?<![A-Za-z0-9])" : "";
  var post=/[A-Za-z0-9]$/.test(phrase) ? "(?![A-Za-z0-9])" : "";
  try{ return new RegExp(pre+body+post,"gi"); }catch(err){ return new RegExp(body,"gi"); }
}
function markIn(root, re){
  var nodes=[], w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n;
  while((n=w.nextNode())){ if(n.nodeValue && n.nodeValue.trim()) nodes.push(n); }
  var touched=0;
  nodes.forEach(function(node){
    var s=node.nodeValue, frag=null, last=0, m, moved=false;
    re.lastIndex=0;
    while((m=re.exec(s))){
      if(!frag) frag=document.createDocumentFragment();
      if(m.index>last) frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      var mk=document.createElement("mark");
      mk.className="en-hl"; mk.textContent=m[0];
      frag.appendChild(mk); enMarks.push(mk);
      last=m.index+m[0].length; moved=true;
      if(!m[0].length) re.lastIndex++;
    }
    if(moved){
      if(last<s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      node.parentNode.replaceChild(frag,node);
      touched++;
    }
  });
  return touched;
}
function highlightEn(term){
  clearEnHL();
  var en=term.dataset? term.dataset.en : "";
  if(!en) return;
  var alts=en.split("||").filter(Boolean);
  var pair=term.closest(".pair");
  var roots=[]; if(pair) roots.push(pair.querySelector(".src"));
  var prev=pair? pair.previousElementSibling : null, k=0;
  while(prev && k<2){ if(prev.querySelector){ var s=prev.querySelector(".src"); if(s) roots.push(s); } prev=prev.previousElementSibling; k++; }
  for(var i=0;i<roots.length && roots[i];i++){
    for(var a=0;a<alts.length;a++){
      if(markIn(roots[i], termRe(alts[a]))) return;
    }
  }
}

/* ---------- 引用文献浮窗 ---------- */
var cbox=document.getElementById("citebox");
var citeTimer=null, citePinned=null;

function scholarUrl(text){
  var q=String(text).replace(/\[[^\]]*\]/g,"").replace(/\s+/g," ").trim();
  return "https://scholar.google.com/scholar?q="+encodeURIComponent(q.slice(0,190));
}
function showCite(a){
  var n=a.dataset.ref, r=CUR_REFS[n];
  if(!r){ return; }
  var html='<div class="ch">引用文献 / REFERENCE</div>'+
    '<div class="ct"><b style="color:var(--accent2)">['+n+']</b> '+esc(r.text)+'</div>'+
    '<div class="ca">'+
      (r.url?'<a target="_blank" rel="noopener" href="'+attr(r.url)+'">打开原文 ↗</a>':'')+
      '<a target="_blank" rel="noopener" href="'+attr(scholarUrl(r.text))+'">Google 学术 ↗</a>'+
      '<a href="#ref-'+n+'" class="jump">文献列表</a>'+
    '</div>';
  cbox.innerHTML=html;
  cbox.classList.add("on");
  var rc=a.getBoundingClientRect(), bc=cbox.getBoundingClientRect();
  var doc=document.getElementById("doc");
  var minLeft=window.innerWidth>1000 ? Math.max(12, doc.getBoundingClientRect().left-8) : 10;
  var left=Math.max(minLeft, Math.min(rc.left-6, window.innerWidth-bc.width-12));
  var top=rc.bottom+8;
  if(top+bc.height>window.innerHeight-10) top=Math.max(10, rc.top-bc.height-8);
  cbox.style.left=left+"px"; cbox.style.top=top+"px";
}
function hideCite(){
  cbox.classList.remove("on");
  if(citePinned){ citePinned.classList.remove("pinned"); citePinned=null; }
}
document.addEventListener("mouseover",function(e){
  var a=e.target.closest? e.target.closest(".cite") : null;
  if(!a) return;
  clearTimeout(citeTimer);
  showCite(a);
});
document.addEventListener("mouseout",function(e){
  var a=e.target.closest? e.target.closest(".cite") : null;
  if(!a || a===citePinned) return;
  clearTimeout(citeTimer);
  citeTimer=setTimeout(function(){ if(!citePinned) cbox.classList.remove("on"); }, 280);
});
cbox.addEventListener("mouseenter",function(){ clearTimeout(citeTimer); });
cbox.addEventListener("mouseleave",function(){
  if(citePinned) return;
  clearTimeout(citeTimer);
  citeTimer=setTimeout(function(){ cbox.classList.remove("on"); }, 200);
});
document.addEventListener("click",function(e){
  var a=e.target.closest? e.target.closest(".cite") : null;

document.getElementById("btnImport").onclick=function(){
  var inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";

  inp.click();

function readPaper(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var p=JSON.parse(fr.result);
      if(!p.meta||!p.sections) throw new Error("缺少 meta 或 sections");
      if(!p.id) p.id="import-"+Date.now();
      PAPERS = PAPERS.filter(function(x){return x.id!==p.id;}).concat([p]);
      window.PAPERS=PAPERS;
      buildLibrary(); open(p);
    }catch(err){ alert("读取失败："+err.message); }
  };
  fr.readAsText(file);
}

document.addEventListener("drop",function(e){

    var y=h.scrollTop+120, cur=null;

      var t=document.querySelector(a.getAttribute("href"));
      if(t && t.offsetTop<=y) cur=a;

/* keyboard */
document.addEventListener("keydown",function(e){
  if(e.target.matches("input,textarea")) return;
  if(e.key==="1") setMode("m-dual");
  else if(e.key==="2") setMode("m-en");
  else if(e.key==="3") setMode("m-zh");
  else if(e.key==="+"||e.key==="="){ S.fs=Math.min(22,S.fs+1); applyFs(); }
  else if(e.key==="-"){ S.fs=Math.max(13,S.fs-1); applyFs(); }
  else if(e.key==="j"||e.key==="k"){
    var pairs=Array.prototype.slice.call(document.querySelectorAll(".pair"));
    var y=window.scrollY+140, idx=-1;
    for(var i=0;i<pairs.length;i++){ if(pairs[i].offsetTop<=y) idx=i; }
    var next = e.key==="j"? Math.min(pairs.length-1, idx+1) : Math.max(0, idx-1);
    if(pairs[next]) window.scrollTo({top:pairs[next].offsetTop-100,behavior:"smooth"});
  }
  else if(e.key==="]"||e.key==="["){
    var secs=Array.prototype.slice.call(document.querySelectorAll(".sec"));
    var y2=window.scrollY+140, ci=-1;
    for(var j=0;j<secs.length;j++){ if(secs[j].offsetTop<=y2) ci=j; }
    var n2=e.key==="]"? Math.min(secs.length-1,ci+1) : Math.max(0,ci-1);
    if(secs[n2]) window.scrollTo({top:secs[n2].offsetTop-60,behavior:"smooth"});
  }
});

});
